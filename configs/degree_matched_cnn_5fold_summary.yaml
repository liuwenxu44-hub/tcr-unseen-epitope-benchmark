schema_version: 1

report_title: Development distance-aware 5-fold query-balanced degree-matched CNN summary
fold_ids: [fold_1, fold_2, fold_3, fold_4, fold_5]

experiment:
  tier: development
  positive_split_strategy: distance_aware
  negative_strategy: DEGREE_MATCHED
  validation_audit_key: degree_matched_5fold_inputs
  manifest_positive_key: positive_input
  query_rotation_source: positive_input_files

bootstrap:
  seed: 13
  iterations: 10000
  confidence_level: 0.95
  batch_size: 128

inputs:
  manifest: data/negatives/distance_aware_5fold_rebalanced_query_balanced_degree_matched_cap100/degree_matched_manifest.json
  results_directory: results/baseline_cnn/development_distance_aware_5fold_rebalanced_query_balanced_degree_matched_cap100
  fold_configs:
    fold_1: configs/baseline_cnn_distance_aware_5fold_rebalanced_fold1_degree_matched_cap100.yaml
    fold_2: configs/baseline_cnn_distance_aware_5fold_rebalanced_fold2_degree_matched_cap100.yaml
    fold_3: configs/baseline_cnn_distance_aware_5fold_rebalanced_fold3_degree_matched_cap100.yaml
    fold_4: configs/baseline_cnn_distance_aware_5fold_rebalanced_fold4_degree_matched_cap100.yaml
    fold_5: configs/baseline_cnn_distance_aware_5fold_rebalanced_fold5_degree_matched_cap100.yaml

outputs:
  directory: results/baseline_cnn/development_distance_aware_5fold_rebalanced_query_balanced_degree_matched_cap100
  summary_csv: five_fold_summary.csv
  summary_json: five_fold_summary.json
  oof_predictions_csv: oof_test_predictions.csv
  oof_per_query_csv: oof_per_query_metrics.csv
  report_md: five_fold_report.md

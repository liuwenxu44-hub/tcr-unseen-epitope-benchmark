schema_version: 1

source:
  input_csv: data/processed/positive_pairs.csv

tiers:
  development:
    classical_hla_loci:
      - A
      - B
      - C
    require_full_resolution_hla: true
    min_positive_pairs_per_pmhc: 20

  strict:
    extends: development
    min_confidence_score: 1
    min_positive_pairs_per_pmhc: 20

outputs:
  development_csv: data/processed/positive_pairs_development.csv
  strict_csv: data/processed/positive_pairs_strict.csv
  manifest_json: data/processed/data_tiers_manifest.json
  report_md: results/data_tiers_report.md

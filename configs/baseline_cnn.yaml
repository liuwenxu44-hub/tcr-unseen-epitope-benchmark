schema_version: 1
seed: 13

experiment:
  tier: development
  positive_split_strategy: random
  negative_strategy: N1

sequence:
  tcr_max_length: 30
  epitope_max_length: 15

dataloader:
  batch_size: 256
  num_workers: 4
  pin_memory: true
  shuffle:
    train: true
    validation: false
    test: false

data:
  positive_split_directory: data/splits
  negative_directory: data/negatives

model:
  aa_vocab_size: 22
  aa_embedding_dim: 64
  cnn_channels: 128
  kernel_sizes: [3, 5]
  hla_embedding_dim: 32
  mlp_hidden_dims: [256, 64]
  padding_idx: 0
  dropout: 0.2
  hla_vocab_size_source: training_partition

optimizer:
  name: Adam
  learning_rate: 0.001

training:
  loss: BCEWithLogitsLoss
  max_epochs: 30
  early_stopping_metric: validation_auprc
  patience: 5

runtime:
  device: auto

output:
  run_dir: results/baseline_cnn/development_random_n1

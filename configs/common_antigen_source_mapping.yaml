creation_commit: "1061f3a35af6176555a527ef83c078a91648d1ee"
creation_commit_role: "Clean project commit from which this post-analysis mapping amendment was created"
creation_date: "2026-07-24"

intended_use:
  - "Figure S1E descriptive cohort composition"
  - "Descriptive cohort summaries in tables and captions"

prohibited_use:
  - "Pre-scoring protocol or confirmatory subgroup definition"
  - "Model training, selection, calibration, scoring, or threshold selection"
  - "Reanalysis or reinterpretation of existing model performance"
  - "Post hoc antigen-source subgroup effect claims"

frozen_category_source:
  path: "configs/external_iedb_audit.yaml"
  commit: "ee2d00a3f672082dca866a04352863eaa0a2ea34"
  sha256: "9893057ba6551485c7ebd59f98bcb3b95f71b4125651413c1299a4dce54ce3d8"
  field_selector: "antigen_source_categories plus implicit unknown_source fallback"

frozen_categories:
  - "tumor_associated"
  - "self_antigen"
  - "pathogen_or_nonself"
  - "other_nonself"
  - "unknown_source"

normalization:
  trim_leading_and_trailing_whitespace: true
  collapse_internal_whitespace: true
  lowercase_for_exact_lookup: true
  pipe_delimiters_preserved: true

unknown_handling:
  category: "unknown_source"
  policy: "Missing, blank, uninformative, or unmapped exact values are assigned to unknown_source."
  reviewer_status: "CONSERVATIVE_UNKNOWN"

query_resolution:
  key: ["epitope", "hla"]
  rule: "all_record_categories_must_agree_else_unknown_source"
  majority_vote_allowed: false
  explanation: "A query retains its shared record category only when every positive record agrees; any cross-category conflict is conservatively assigned to unknown_source."


inputs:
  positive_directory: data/splits/distance_aware_5fold_rebalanced
  positive_manifest:
    path: data/splits/distance_aware_5fold_rebalanced/distance_aware_5fold_rebalanced_positive_splits_manifest.json
    sha256: 9f29988e4b8c06bdf908a03450e778ea7c998464e822b934d637d42e23e8769f
  positive_registry:
    path: data/processed/positive_pairs.csv
    sha256: daf194af47afa684199f795aca3433bb645f74d29356b7553ee55551c283bbdb
  query_balance_audit:
    path: results/distance_aware_5fold_query_balance_audit/query_balance_audit.csv
    sha256: b9b0db688e4e76b9e78fbc6b29d989eec9bc3e7b21941beda8ea669d526c03e2

outputs:
  positive_directory: data/splits/distance_aware_5fold_rebalanced_query_balanced_cap100
  positive_csv_pattern: development_distance_aware_rebalanced_{fold}_{partition}_query_balanced_cap100.csv
  negative_directory: data/negatives/distance_aware_5fold_rebalanced_query_balanced_n1_cap100
  negative_csv_pattern: development_distance_aware_rebalanced_{fold}_{partition}_query_balanced_cap100_n1.csv
  manifest_json: data/negatives/distance_aware_5fold_rebalanced_query_balanced_n1_cap100/query_balanced_n1_cap100_manifest.json

schema_version: 1
base_seed: 13
tier: development
fold_ids: [fold_1, fold_2, fold_3, fold_4, fold_5]
partitions: [train, validation, test]
query_key: [epitope, hla]
interaction_key: [tcr_cdr3_beta, epitope, hla]
per_query_cap: 100

seed_derivation:
  algorithm: sha256
  namespace: base_seed|fold_id|partition|epitope|hla|query_balanced_n1_cap100

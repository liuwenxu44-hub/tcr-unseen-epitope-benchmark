schema_version: 1
tier: development
fold_ids: [fold_1, fold_2, fold_3, fold_4, fold_5]
partitions: [train, validation, test]
query_key: [epitope, hla]
interaction_key: [tcr_cdr3_beta, epitope, hla]

resampling:
  count: 5
  base_seeds: [13, 1013, 2013, 3013, 4013]
  seed_derivation: sha256(base_seed,fold_id,partition)

matching:
  problem: bipartite_b_matching
  solver: scipy.sparse.csgraph.maximum_flow
  method: dinic
  source_tcr_capacity: positive_tcr_degree
  tcr_query_capacity: 1
  query_sink_capacity: positive_query_degree
  ordering: seeded_tcr_and_query_node_permutation
  require_exact: true

inputs:
  positive_manifest:
    path: data/negatives/distance_aware_5fold_rebalanced_query_balanced_n1_cap100/query_balanced_n1_cap100_manifest.json
    sha256: 51a6f98a01b7348868d495378104834074b9c0fdc4d93281c0110f7415832ac3
  positive_registry:
    path: data/processed/positive_pairs.csv
    sha256: daf194af47afa684199f795aca3433bb645f74d29356b7553ee55551c283bbdb
  original_degree_matched_manifest:
    path: data/negatives/distance_aware_5fold_rebalanced_query_balanced_degree_matched_cap100/degree_matched_manifest.json
    sha256: e118d8bd655353cc2ff7287378ba0c75b370e8f6d25d97549dbb9b3ee5e6631d

outputs:
  root_directory: data/negatives/distance_aware_5fold_rebalanced_query_balanced_degree_matched_cap100_resamples
  negative_csv_pattern: development_distance_aware_rebalanced_{fold}_{partition}_query_balanced_cap100_degree_matched_resample.csv
  manifest_json: data/negatives/distance_aware_5fold_rebalanced_query_balanced_degree_matched_cap100_resamples/degree_matched_resamples_manifest.json
  report_md: results/distance_aware_5fold_degree_matched_resamples/degree_matched_resamples_report.md
